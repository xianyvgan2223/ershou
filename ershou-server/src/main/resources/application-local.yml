# 本地覆盖配置（不含任何明文密钥）
# 启动方式： --spring.profiles.active=dev,local
# 真实值统一放仓库根 .env（已被 .gitignore 忽略），由 scripts/dev-*.ps1 等启动脚本载入；
# IDEA 直接运行时请在 Run Configuration 里配置对应的环境变量。
spring:
  datasource:
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      password: ${REDIS_PASSWORD}
ershou:
  storage:
    secret-key: ${MINIO_ROOT_PASSWORD}
