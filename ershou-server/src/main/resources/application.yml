server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: ershou-server
  profiles:
    # dev = 开发配置占位符；local = 本机真实密码（application-local.yml，已被 .gitignore 忽略）
    # 这样在 IDEA 里直接运行也不需要额外配置；文件不存在时 Spring 会忽略
    active: dev,local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  # 会话有效期：10 年（≈"登录一次之后一直保持"，除非用户自己点退出登录）。
  #
  # 原来是 604800 秒 = 7 天，这是**真实会掉登录**的一个坑：
  # 学生放假 7 天以上没打开 App，回来就得重新登录，而这并不是用户"自己退出"。
  # 一个校园二手平台没有理由让会话过期 —— 真要作废凭证，有"退出登录"和服务端
  # 删会话（Redis 里 Authorization:login:token:* ）两条路，不需要靠时间。
  #
  # 为什么不用 -1：Sa-Token 把 -1 当"永不过期"，但 Redis 这种带 TTL 的存储
  # 对永久 key 的处理各版本不一致，给个明确的 10 年更可控（315360000 秒）。
  timeout: 315360000
  # 不因"长期不活跃"而失效（-1 = 关闭活跃超时）。否则前面那个 10 年形同虚设：
  # 只要闲置超过这个阈值，token 一样会被判失效。
  active-timeout: -1
  # 允许多端同时在线（手机 + 电脑互不影响）
  is-concurrent: true
  # 每次登录发新 token（不共用），方便按设备单独退出
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

ershou:
  # 读缓存（Redis）：enabled=false 一键回滚到直连 DB，缓存不参与业务正确性
  cache:
    enabled: true
    item-detail-ttl: 10m
    null-value-ttl: 60s
    map-points-ttl: 30m
    dict-ttl: 1h
    dashboard-ttl: 30s
    view-flush-cron: "0 */10 * * * ?"
  # 商品有效期与限时下架（第 4 轮新增显式配置；默认值 = 原来的 7 天行为，生产不受影响）
  # 开发/演示期商品太少时：在 .env 里设 ITEM_VALIDITY_ENABLED=false 即可整体关闭限时
  # （发布/重新上架不写 expire_at，到期任务跳过），无需改代码。
  item:
    # 商品有效期（天）：发布 / 重新上架时写入 expire_at = now + valid-days
    valid-days: ${ITEM_VALID_DAYS:7}
    # 商品限时总开关：false 时发布/重新上架**不写 expire_at（NULL = 永久有效）**，到期任务跳过
    validity-enabled: ${ITEM_VALIDITY_ENABLED:true}
    # 过期任务 cron（默认每小时 :30）；开发期想验证任务可临时改 */10 * * * * ?
    expire-cron: "${ITEM_EXPIRE_CRON:0 30 * * * ?}"
  crypto:
    # 手机号 AES 密钥（16 位）。真实值放 .env（PHONE_AES_KEY），缺失时启动失败
    phone-key: ${PHONE_AES_KEY}
    # 聊天正文加密密钥。真实值放 .env（CHAT_CONTENT_KEY），缺了会导致历史消息解不开
    chat-key: ${CHAT_CONTENT_KEY}
  amap:
    # 高德 Web端(JS API) key：**给前端用的公开 key，不是密钥**（真正要保密的是 Web 服务 key）。
    # 放后端是为了让移动端（WebView 承载高德地图）不用把 key 打进 App、也不用用户手输：
    # App 直接 GET /api/v1/map/amap-html 拿到一个已经带好 key 的地图页。
    # 安全密钥 securityJsCode 也必须一起下发——2021-12-02 后创建的 key 强制要求。
    js-key: ${AMAP_JS_KEY:}
    js-security-code: ${AMAP_JS_SECURITY_CODE:}
    # Web 服务 key（restapi.amap.com 用，需要在控制台绑定 IP 白名单）。
    # 只用于服务端调用（目前是选点后的逆地理编码），**绝不下发给前端**。
    # 没配时 /map/regeo 会返回空列表，移动端退化为"手动填名称"。
    web-key: ${AMAP_WEB_KEY:}
  sms:
    mock: true
    mock-code: "123456"
  admin:
    # 运营后台：sys_user.role_flags 命中 8 位即视为运营
    role-flag: 8
    # 额外的运营用户 id 白名单（逗号分隔，本地开发/应急用）
    user-ids: ${ERSHOU_ADMIN_USER_IDS:}
  review:
    # 上架审核（运营后台「上架审核」页）
    # 实时推送：新上架 / 改名 / 被处置秒级推到所有审核员页面（ws://host/ws/admin/review）
    realtime-enabled: true
    online-ttl: 90s
    max-batch-size: 50
    # 违规下架的商品是否需要卖家二次申请 + 运营审核才能回到在售
    violation-relist-enabled: true
    # 处置完的记录在列表里保留多久（审核员能回看"我刚点了什么"）
    done-keep-window: 24h
  storage:
    mode: minio
    endpoint: http://127.0.0.1:9010
    access-key: ${MINIO_ROOT_USER:ershou}
    # 不给默认值：密码缺失时应当启动报错，而不是静默用示例密码去连
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ershou
    public-base-url: http://127.0.0.1:9010/ershou
    max-size-mb: 5
    image-max-edge: 1280
    local-path: ./upload/
    local-url-prefix: http://127.0.0.1:8080/static/
