# =============================================================
# 第 5 轮 · Spring Cloud 中间件编排（Docker）
# 用法：
#   docker compose -f ershou-cloud/docker/docker-compose.yml up -d
#   或 scripts/cloud-up.ps1
# 说明：
#   - 服务（gateway/user/item/order）在宿主机用 mvn 启动，故宿主用 127.0.0.1 访问；
#   - 容器之间用服务名（nacos:8848）访问；
#   - Redis 沿用现有 ershou-redis（6380），不在此编排。
# =============================================================
name: ershou-cloud

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: ershou-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: "no"
    networks: [ershou-cloud-net]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ershou-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: "no"
    networks: [ershou-cloud-net]

  seata:
    image: seataio/seata-server:1.8.0
    container_name: ershou-seata
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "8091:8091"   # TC 事务端口
      - "7091:7091"   # Seata 控制台
    volumes:
      # 该镜像为 Jib 构建，配置只认 /seata-server/resources/application.yml（没有 registry.conf）
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
    environment:
      - TZ=Asia/Shanghai
      # 真实值放仓库根 .env（cloud-up.ps1 / 文档命令用 --env-file 传入）
      - SEATA_CONSOLE_USERNAME=${SEATA_CONSOLE_USERNAME:?set in .env}
      - SEATA_CONSOLE_PASSWORD=${SEATA_CONSOLE_PASSWORD:?set in .env}
      - SEATA_NACOS_USERNAME=${SEATA_NACOS_USERNAME:?set in .env}
      - SEATA_NACOS_PASSWORD=${SEATA_NACOS_PASSWORD:?set in .env}
      - SEATA_SECRET_KEY=${SEATA_SECRET_KEY:?set in .env}
    restart: "no"
    networks: [ershou-cloud-net]

  sentinel-dashboard:
    build:
      context: ./sentinel
      dockerfile: Dockerfile
    image: ershou/sentinel-dashboard:1.8.8
    container_name: ershou-sentinel
    ports:
      - "8858:8858"
    environment:
      - TZ=Asia/Shanghai
    restart: "no"
    networks: [ershou-cloud-net]

volumes:
  nacos-data:
  nacos-logs:
  rabbitmq-data:

networks:
  ershou-cloud-net:
    driver: bridge
