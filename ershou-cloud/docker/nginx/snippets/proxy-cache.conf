# 缓存 location 的公共反向代理 / 缓存指令。
# 调用方只需再声明 proxy_cache_valid。
proxy_pass http://ershou_gateway;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 上游不压缩，由 Nginx 统一 gzip，避免 Vary: Accept-Encoding 造成多份缓存
proxy_set_header Accept-Encoding "";

proxy_cache              ershou_cache;
proxy_cache_key          "$scheme$request_method$http_host$request_uri";
proxy_cache_methods      GET HEAD;
proxy_cache_lock         on;
proxy_cache_lock_timeout 2s;
proxy_cache_background_update on;
proxy_cache_use_stale    error timeout updating http_500 http_502 http_503 http_504;

# 带登录态 / 主动 no-cache 的请求：既不读缓存，也不写入缓存
proxy_cache_bypass       $ershou_bypass;
proxy_no_cache           $ershou_bypass;

add_header X-Cache-Status $upstream_cache_status always;
