# =============================================================
# ershou-cloud · Nginx 边缘缓存（三级缓存的 L1）
# 只缓存匿名公开 GET；带 Authorization/Cookie 的请求直接绕过。
# =============================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache=$upstream_cache_status upstream=$upstream_addr';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 30m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # L1 缓存区：TTL 由各 location 的 proxy_cache_valid 控制，这里只负责容量与清理
    proxy_cache_path /var/cache/nginx/ershou levels=1:2 keys_zone=ershou_cache:100m
                     max_size=1g inactive=5m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
