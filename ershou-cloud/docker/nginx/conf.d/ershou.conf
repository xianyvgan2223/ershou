# =============================================================
# 反向代理 + L1 缓存规则
# 网关跑在宿主机 127.0.0.1:8088；容器通过 host.docker.internal 访问。
# =============================================================
upstream ershou_gateway {
    server host.docker.internal:8088;
    keepalive 32;
}

# 任一变量非空即视为“用户态请求”：
#   Authorization / satoken Cookie / 客户端伪造的 X-User-Id / Cache-Control / ?nocache=1
# 映射结果 1 = bypass，空 = 可缓存。
map "$http_authorization$cookie_authorization$cookie_satoken$http_x_user_id$http_cache_control$arg_nocache" $ershou_bypass {
    default 1;
    ""      0;
}

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------
    # L1：匿名公开读（TTL 故意很短，写操作最多延迟一个 TTL）
    # ---------------------------------------------------------
    location = /api/v1/items {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 3s;
    }

    location ~ ^/api/v1/items/[0-9]+$ {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 3s;
    }

    location ^~ /api/v1/categories {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 10s;
    }

    location ^~ /api/v1/search {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 3s;
    }

    location ^~ /api/v1/map {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 5s;
    }

    location ^~ /api/v1/trade-points {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 5s;
    }

    location ^~ /api/v1/platform/shop/ {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 5s;
    }

    location ^~ /api/v1/schools {
        include /etc/nginx/snippets/proxy-cache.conf;
        proxy_cache_valid 200 30s;
    }

    # ---------------------------------------------------------
    # 不缓存：登录、订单/购物车/收藏、聊天、管理后台、上传、/items/mine 等
    # ---------------------------------------------------------
    location /api/ {
        proxy_pass http://ershou_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket：必须透传 Upgrade，禁止缓存
    location /ws {
        proxy_pass http://ershou_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}
