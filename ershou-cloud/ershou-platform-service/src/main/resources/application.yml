server:
  port: 8086

spring:
  application:
    name: ershou-platform-service
  # 第 8 轮全量拆分契约：本地只留端口/服务名/Nacos 地址 + config.import；
  # 数据源（ershou_platform）、Redis(db4)、MyBatis-Plus、Feign/Sentinel、业务配置全部放 Nacos。
  config:
    import: optional:nacos:ershou-platform-service.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info
