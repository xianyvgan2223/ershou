# =============================================================
# Nacos dataId: ershou-order-service.yaml   （group=DEFAULT_GROUP）
# 订单服务（:8083）：MySQL ershou_order / Redis db3 / RabbitMQ / Seata TM / Feign+Sentinel
# =============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ershou_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ershou_order
    password: __REDACTED_DB_PASSWORD__
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: __REDACTED_DB_PASSWORD__
      database: 3          # 下单幂等/订单号序列，前缀 ershou:order:
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
        port: 8721

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# Seata 全局事务（TM 在本服务；Feign 调 item-service 的锁库存作为 AT 分支）
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ershou_tx_group
  service:
    vgroup-mapping:
      ershou_tx_group: default
    # 直连 TC：TC 在 Nacos 注册的是容器 IP（如 172.20.0.x），宿主机不可达；
    # docker-compose 已把 8091 映射到宿主，客户端用 grouplist 直接连 127.0.0.1:8091（演示环境）
    grouplist:
      default: 127.0.0.1:8091
  registry:
    # 【演示环境直连 TC】TC 在 Nacos 里注册的是容器 IP（172.20.0.x），Windows 宿主机不可达；
    # docker-compose 已把 8091 映射到宿主，这里用 registry.type=file + service.grouplist 直连 127.0.0.1:8091。
    # 若 compose 给 seata 容器加 `SEATA_IP=127.0.0.1`（注册宿主可达 IP），可改回 type=nacos（下方 nacos 配置保留）。
    type: file
    nacos:
      server-addr: 127.0.0.1:8848
      application: seata-server
      group: SEATA_GROUP
      username: nacos
      password: nacos
      cluster: default
  config:
    type: file
  data-source-proxy-mode: AT

# OpenFeign：Sentinel 降级（item-service 不可用时走 ItemClientFallback，code=90001）
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: basic
  httpclient:
    enabled: true

ershou:
  order:
    # Nacos 动态配置演示点（订单数量上限；业务代码读取后改配置即可热更新）
    max-qty: 99
    # 自提单状态：2=待面交/待自提
    default-status: 2

logging:
  level:
    com.ershou.cloud.order: info
    com.baomidou: warn
    com.alibaba.nacos: warn
