# =============================================================
# Nacos dataId: ershou-order-service.yaml   （group=DEFAULT_GROUP）
# 交易域微服务（:8083）：MySQL ershou_order / Redis db3 / RabbitMQ / Seata TM / Feign+Sentinel
# 负责：购物车 / 收藏 / 面交单全状态机 / 信用分流水；对 item-service、user-service、map-service 走 Feign
# =============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ershou_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ershou_order
    password: __REDACTED_DB_PASSWORD__
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: __REDACTED_DB_PASSWORD__
      database: 3          # 下单幂等/订单号序列，前缀 ershou:order:
      timeout: 3s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2
  cloud:
    sentinel:
      eager: true
      transport:
        dashboard: 127.0.0.1:8858
        port: 8721

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# Seata 全局事务（TM 在本服务；Feign 调 item-service 的锁库/售出作为 AT 分支）
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ershou_tx_group
  service:
    vgroup-mapping:
      ershou_tx_group: default
    # 直连 TC：TC 在 Nacos 注册的是容器 IP（如 172.20.0.x），宿主机不可达；
    # docker-compose 已把 8091 映射到宿主，客户端用 grouplist 直接连 127.0.0.1:8091（演示环境）
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
    nacos:
      server-addr: 127.0.0.1:8848
      application: seata-server
      group: SEATA_GROUP
      username: nacos
      password: nacos
      cluster: default
  config:
    type: file
  data-source-proxy-mode: AT

# OpenFeign：Sentinel 降级（各下游服务不可用时走 *Fallback，返回 code=90001）
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000
        logger-level: basic
      ershou-item-service:
        connect-timeout: 2000
        read-timeout: 4000
      ershou-user-service:
        connect-timeout: 2000
        read-timeout: 4000
      ershou-map-service:
        connect-timeout: 2000
        read-timeout: 4000
  httpclient:
    enabled: true

# 交易业务参数（@RefreshScope：Nacos 改动后无需重启，下一个请求即生效）
ershou:
  order:
    max-qty: 99                # 单次下单数量上限（演示动态生效点）
    default-status: 1          # 个人意向单初始状态：1=待卖家确认（与旧单体一致）
    lock-buffer-hours: 2       # 卖家接受后锁库到「时间窗结束 + N 小时」
    lock-default-hours: 24     # 没填时间窗时锁 N 小时
    max-slot-minutes: 180      # 单次面交时间窗上限（3 小时）
    max-slot-days: 7           # 最远可预约天数
    platform-seller-id: 1000   # 平台代卖官方账号 id
    platform-item-status: 2    # 平台自提单初始状态：2=待自提/待面交

logging:
  level:
    com.ershou.cloud.order: info
    com.baomidou: warn
    com.alibaba.nacos: warn
