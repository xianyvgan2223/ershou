# =============================================================
# Nacos dataId: ershou-user-service.yaml   （group=DEFAULT_GROUP）
# 用户服务（:8081）：MySQL ershou_user / Redis db1（业务）/ db0（Sa-Token 会话）
# =============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ershou_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ershou_user
    password: __REDACTED_DB_PASSWORD__
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: __REDACTED_DB_PASSWORD__
      database: 1          # 业务键（验证码/登录限流）落 db1，前缀 ershou:user:
      timeout: 3s
  # OpenFeign（T101）：公开主页 onSaleCount 调 item-service。
  # 超时给短一点：这是展示字段，商品服务没起时不该把公开主页也拖慢/拖挂。
  # 注意：本版本 Spring Cloud 的 connect-timeout/read-timeout 是 Integer 毫秒（不能写 1s）。
  cloud:
    # 注册 IP 固定 127.0.0.1（与 order/item 服务一致）：
    # 演示机有多个网卡（WSL/Docker/VPN），自动探测会注册到宿主机不可路由的地址，导致网关 lb:// 调不到。
    nacos:
      discovery:
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
            logger-level: basic

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# Sa-Token：与单体完全一致；会话落 db0（由 SaTokenRedisConfig 单独连接，业务仍用 db1）
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 315360000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

ershou:
  cloud:
    # SaTokenRedisConfig 用：会话库固定 db0（host/port/password 复用 spring.data.redis.*）
    session-redis-database: 0
  crypto:
    phone-key: __REDACTED_PHONE_KEY__
  sms:
    mock: true
    mock-code: "123456"
    max-per-day: 10
  admin:
    role-flag: 8
    # 运营白名单（逗号分隔用户 id；与单体 AdminProperties.userIds 同语义，空=不启用）。
    # 口径：先白名单再 role_flags & role-flag，保证 /users/me 的 isAdmin 与单体一致。
    user-ids: ${ERSHOU_ADMIN_USER_IDS:}
  user:
    # 信用分单次调整范围 ±（与单体 AdminUserService.CREDIT_MAX_DELTA 一致）
    credit-max-delta: 100

logging:
  level:
    com.ershou.cloud.user: info
    com.baomidou: warn
